version: '2'
sql:
  - engine: 'postgresql'
    schema: 'db/migrations'
    queries: 'db/query'
    gen:
      go:
        package: 'repository'
        out: 'internal/repository'
        sql_package: 'pgx/v5'
        emit_result_struct_pointers: true
        overrides:
          - db_type: 'uuid'
            go_type: 'github.com/google/uuid.UUID'


syntax = "proto3";
import "proto/base/v1/base.proto";

package proto.action.v1;

option go_package = "go-api/pkg/api/actionpb;actionpb";

enum ActionRequestType {
  ACTION_REQUEST_TYPE_UNSPECIFIED = 0;
  ACTION_REQUEST_TYPE_VIEW = 1;
  ACTION_REQUEST_TYPE_HTTP = 2;
  ACTION_REQUEST_TYPE_GRAPHQL = 3;
  ACTION_REQUEST_TYPE_GRPC = 4;
  ACTION_REQUEST_TYPE_WEBSOCKET = 5;
}

message Action {
  string action_id = 1;
  string resource_id = 2;
  string name = 3;
  string description = 4;
  ActionRequestType request_type = 5;
  string url = 6;
  string method = 7;
  string created_at = 8;
  string created_user_id = 9;
  string updated_at = 10;
  string updated_user_id = 11;
  string deleted_at = 12;
  string deleted_user_id = 13;
}

message CreateActionData {
  string resource_id = 1;
  string name = 2;
  string description = 3;
  ActionRequestType request_type = 4;
  string url = 5;
  string method = 6;
}

message UpdateActionData {
  string action_id = 1;
  string resource_id = 2;
  string name = 3;
  string description = 4;
  ActionRequestType request_type = 5;
  string url = 6;
  string method = 7;
}

message GetActionRequest {
  string action_id = 1;
}

message GetActionsRequest {
  proto.base.v1.PaginationRequest pagination = 1;
  repeated proto.base.v1.Sort sorts = 2;
  repeated proto.base.v1.Filter filters = 3;

}
message GetActionsResponse {
  proto.base.v1.PaginationResponse pagination = 1;
  repeated Action data = 2;
}

message CreateActionRequest {
  CreateActionData action = 1;
  string user_id = 2;
}

message UpdateActionRequest {
  UpdateActionData action = 1;
  string user_id = 2;
}

message DeleteActionRequest {
  string action_id = 1;
  string user_id = 2;
}

message CreateSuccess {
  Action action = 1;
  repeated proto.base.v1.ErrorMessage errors = 2;
}

message GetActionResponse {
  Action action = 1;
  repeated proto.base.v1.ErrorMessage errors = 2;
}

// ActionService: manage actions for resources
// Sample GetAction request: { "action_id": "uuid" }
// Sample GetAction response: Action
service ActionService {
  // GetAction returns a single Action by id
  // Req example: { "action_id": "uuid" }
  // Res example: { "action_id": "...", "name": "...", "request_type": HTTP }
  rpc GetAction (GetActionRequest) returns (GetActionResponse) {}

  // GetActions returns paginated actions
  // Req example: { "pagination": { "page": 1, "limit": 10 } }
  // Res example: { "pagination": { "page":1, "limit":10, "totalItems":0 }, "data": [] }
  rpc GetActions (GetActionsRequest) returns (GetActionsResponse) {}

  // CreateAction creates a new action
  // Req example: { "action": { "resource_id": "uuid", "name": "Read", "request_type": HTTP } }
  // Res example: CreateSuccess
  rpc CreateAction (CreateActionRequest) returns (CreateSuccess) {}

  // UpdateAction updates an existing action
  // Req example: { "action": { "action_id": "uuid", "name": "Updated" } }
  // Res example: { result: { success: true } }
  rpc UpdateAction (UpdateActionRequest) returns (proto.base.v1.UpdateSuccess) {}

  // DeleteAction performs soft delete
  // Req example: { "action_id": "uuid", "user_id": "uuid" }
  // Res example: { result: { success: true } }
  rpc DeleteAction (DeleteActionRequest) returns (proto.base.v1.DeleteSuccess) {}
}
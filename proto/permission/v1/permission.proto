
syntax = "proto3";
import "proto/base/v1/base.proto";

package proto.permission.v1;

option go_package = "go-api/pkg/api/permissionpb;permissionpb";

message Permission {
  string permission_id = 1;
  string role_id = 2;
  string resource_id = 3;
  string action_id = 4;
  string created_user_id = 5;
  string updated_at = 6;
  string updated_user_id = 7;
  string deleted_at = 8;
  string deleted_user_id = 9;
  string created_at = 10;
}

message CreatePermissionData {
  string role_id = 1;
  string resource_id = 2;
  string action_id = 3;
}

message UpdatePermissionData {
  string permission_id = 1;
  string role_id = 2;
  string resource_id = 3;
  string action_id = 4;
}

message GetPermissionRequest {
  string permission_id = 1;
}

message GetPermissionsRequest {
  proto.base.v1.PaginationRequest pagination = 1;
  repeated proto.base.v1.Sort sorts = 2;
  repeated proto.base.v1.Filter filters = 3;
}

message GetPermissionsResponse {
  proto.base.v1.PaginationResponse pagination = 1;
  repeated Permission data = 2;
}

message CreatePermissionRequest {
  CreatePermissionData permission = 1;
  string user_id = 2;
}

message UpdatePermissionRequest {
  UpdatePermissionData permission = 1;
  string user_id = 2;
}

message DeletePermissionRequest {
  string permission_id = 1;
  string user_id = 2;
}

message CreateSuccess {
  Permission permission = 1;
  repeated proto.base.v1.ErrorMessage errors = 2;
}

message PermissionInfo {
  string name = 1;
  string request_type = 2;
  string method = 3;
  string url = 4;
}

message GetPermissionsByUserIdRequest {
  string user_id = 1;
}

message GetPermissionsByUserIdResponse {
  repeated PermissionInfo permissions = 1;
}

// PermissionService: manage role-resource-action permissions
service PermissionService {
  // GetPermission returns a single permission by id
  // Req example: { "permission_id": "uuid" }
  rpc GetPermission (GetPermissionRequest) returns (Permission) {}

  // GetPermissions returns paginated permissions
  // Req example: { "pagination": { "page":1, "limit":10 } }
  rpc GetPermissions (GetPermissionsRequest) returns (GetPermissionsResponse) {}

  // CreatePermission assigns permission for role-resource-action
  // Req example: { "permission": { "role_id":"uuid", "resource_id":"uuid", "action_id":"uuid" }, "user_id":"uuid" }
  rpc CreatePermission (CreatePermissionRequest) returns (CreateSuccess) {}

  // UpdatePermission updates a permission mapping
  // Req example: { "permission": { "permission_id":"uuid", ... }, "user_id":"uuid" }
  rpc UpdatePermission (UpdatePermissionRequest) returns (proto.base.v1.UpdateSuccess) {}

  // DeletePermission soft-deletes a permission
  // Req example: { "permission_id":"uuid", "user_id":"uuid" }
  rpc DeletePermission (DeletePermissionRequest) returns (proto.base.v1.DeleteSuccess) {}

  // GetPermissionsByUserId returns permissions available to a user
  // Req example: { "user_id":"uuid" }
  // Res example: { "permissions": [ { "resource": {...}, "action": {...} } ] }
  rpc GetPermissionsByUserId (GetPermissionsByUserIdRequest) returns (GetPermissionsByUserIdResponse) {}
}

syntax = "proto3";
import "proto/base/v1/base.proto";

package proto.role.v1;

option go_package = "go-api/pkg/api/rolepb;rolepb";

// Role represents a permission role in the system.
// Fields:
// - role_id: unique identifier for the role
// - name: display name of the role
// - description: human-readable description
// - module_id: the module this role belongs to
// - created_user_id: user who created the role
// - updated_at / updated_user_id: last update info
// - deleted_at / deleted_user_id: deletion info
// - created_at: creation timestamp
//
// Example (GetRole response):
// {
//   "role_id": "role-123",
//   "name": "Admin",
//   "description": "Administrator role",
//   "module_id": "module-1",
//   "created_user_id": "user-1",
//   "created_at": "2024-01-01T00:00:00Z"
// }
message Role {
  string role_id = 1;
  string name = 2;
  string description = 3;
  string module_id = 4;
  string created_user_id = 5;
  string updated_at = 6;
  string updated_user_id = 7;
  string deleted_at = 8;
  string deleted_user_id = 9;
  string created_at = 10;
}

// Permission pairs a resource with an action and optional id.
// Example:
// { "resource_id": "res-1", "action_id": "act-1" }
message Permission {
  string resource_id = 1;
  string action_id = 2;
  optional string permission_id = 3;
}

// Payload used to create a role (excluding metadata fields).
// Example (CreateRoleRequest.role):
// {
//   "name": "Editor",
//   "description": "Can edit content",
//   "module_id": "module-2",
//   "permissions": [ { "resource_id": "res-1", "action_id": "edit" } ]
// }
message CreateRoleData {
  string name = 1;
  string description = 2;
  string module_id = 3;
  repeated Permission permissions = 4;
}

// Payload used to update an existing role.
message UpdateRoleData {
  string role_id = 1;
  string name = 2;
  string description = 3;
  string module_id = 4;
  repeated Permission permissions = 5;
}

// Request to fetch a single role by id.
// Example Request:
// { "role_id": "role-123" }
message GetRoleRequest {
  string role_id = 1;
}

// Request to fetch a paginated list of roles.
message GetRolesRequest {
  proto.base.v1.PaginationRequest pagination = 1;
  repeated proto.base.v1.Sort sorts = 2;
  repeated proto.base.v1.Filter filters = 3;
}

// Response for list queries containing pagination and role entries.
message GetRolesResponse {
  proto.base.v1.PaginationResponse pagination = 1;
  repeated Role data = 2;
}

// CreateRoleRequest wraps role data and the acting user id.
// Example Request:
// {
//   "role": { "name": "Viewer", "description": "Read-only", "module_id": "module-3" },
//   "user_id": "user-42"
// }
message CreateRoleRequest {
  CreateRoleData role = 1;
  string user_id = 2;
}

// UpdateRoleRequest contains the changes and acting user id.
message UpdateRoleRequest {
  UpdateRoleData role = 1;
  string user_id = 2;
}

// DeleteRoleRequest indicates which role to delete and who requested it.
message DeleteRoleRequest {
  string role_id = 1;
  string user_id = 2;
}

// CreateSuccess returns the created role and any validation errors.
message CreateSuccess {
  Role role = 1;
  repeated proto.base.v1.ErrorMessage errors = 2;
}

message GetRoleResponse {
  Role role = 1;
  repeated proto.base.v1.ErrorMessage errors = 2;
}

// Role service provides basic CRUD operations for roles.
service RoleService {
  // GetRole returns a single Role identified by `role_id`.
  // Example Request:
  // { "role_id": "role-123" }
  rpc GetRole (GetRoleRequest) returns (GetRoleResponse) {}

  // GetRoles returns a paginated list of roles with optional filters and sorts.
  // Example Request:
  // {
  //   "pagination": { "page": 1, "limit": 20 },
  //   "sorts": [ { "field": "created_at", "order": 1 } ]
  // }
  // Example Response (GetRolesResponse):
  // {
  //   "pagination": { "page": 1, "limit": 20, "total_items": 100, "total_pages": 5, "item_count": 20 },
  //   "data": [ { /* Role objects */ } ]
  // }
  rpc GetRoles (GetRolesRequest) returns (GetRolesResponse) {}

  // CreateRole creates a new role. `user_id` is the actor performing the operation.
  // Example Request:
  // {
  //   "role": { "name": "Viewer", "description": "Read-only", "module_id": "module-3" },
  //   "user_id": "user-42"
  // }
  // Example Response (CreateSuccess):
  // {
  //   "role": { "role_id": "role-124", "name": "Viewer", "module_id": "module-3" },
  //   "errors": []
  // }
  rpc CreateRole (CreateRoleRequest) returns (CreateSuccess) {}

  // UpdateRole updates an existing role. Returns UpdateSuccess indicating operation result.
  // Example Request:
  // {
  //   "role": { "role_id": "role-123", "name": "Manager" },
  //   "user_id": "user-2"
  // }
  // Example Response (proto.base.v1.UpdateSuccess):
  // { "success": true, "errors": [] }
  rpc UpdateRole (UpdateRoleRequest) returns (proto.base.v1.UpdateSuccess) {}

  // DeleteRole marks a role as deleted. Returns DeleteSuccess indicating operation result.
  // Example Request:
  // { "role_id": "role-123", "user_id": "user-2" }
  // Example Response (proto.base.v1.DeleteSuccess):
  // { "success": true, "errors": [] }
  rpc DeleteRole (DeleteRoleRequest) returns (proto.base.v1.DeleteSuccess) {}
}
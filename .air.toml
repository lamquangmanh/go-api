root = "."
tmp_dir = "tmp"

[build]
  cmd = "GOAPI_CONFIG=${GOAPI_CONFIG:-configs/config.yml} go build -o ./tmp/main ./cmd/grpc"
  bin = "./tmp/main"
  full_bin = "GOAPI_CONFIG=${GOAPI_CONFIG:-configs/config.yml} ./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  exclude_dir = ["tmp", "vendor", "coverage", "bin"]
  delay = 500
  stop_on_error = true

[log]
  time = true

[color]
  main = "cyan"
  watcher = "yellow"
  build = "green"
  runner = "magenta"

[misc]
  clean_on_exit = true
